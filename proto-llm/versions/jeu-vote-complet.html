const st={page:'themes',tour:1,tourEnabled:true,login:'mon_profil',write:true,readLogin:'',secondLogin:'profil_alex',source:'themes',scope:'questionnaire',theme:'Fiscalité',group:'Finances publiques',trans:0,idx:0,answers:{},locks:{},validated:{},wasValidated:{},changed:{},draft:{},expanded:'Finances publiques',saveState:'',password:'',mobile:false};
const key=(source,id)=>`${st.tour}:${source}:${id}`;const qid=()=>st.source==='themes'?st.theme:st.trans;const currentKey=()=>key(st.source,qid());
function qsFor(source,id,tour=st.tour){
 if(source==='transversaux'){
   return Array.from({length:7},(_,i)=>{
     const t=themeNames[(id*3+i*5)%themeNames.length];
     const sourceQs=qsFor('themes',t,1);
     return sourceQs[(id+i)%sourceQs.length];
   }).filter(p=>tour===1||p.candidate<2);
 }
 let list=samples[id]||generic.map(t=>t.replace('ce domaine',`le domaine « ${id} »`));
 return list.map((text,i)=>({id:`theme:${id}:${i}`,text,candidate:(i+idHash(id))%people.length,theme:id,source:'Source du programme (lien de démonstration)'})).filter(p=>tour===1||p.candidate<2);
}
function samplesPlaceholder(t,i){let a=samples[t]||generic.map(x=>x.replace('ce domaine',`le domaine « ${t} »`));return a[i%a.length]}

function answeredCount(qs){return qs.filter(p=>st.answers[p.id]!==undefined).length}
function isValid(source,id,tour=st.tour){let qs=qsFor(source,id,tour);return qs.length>0&&(st.validated[`${tour}:${source}:${id}`]||qs.every(p=>st.locks[p.id]))&&!qs.some(p=>st.changed[p.id]);}
function isLocked(id){return!!st.locks[id]&&!st.changed[id]}
function stat(source,id,tour=st.tour){let qs=qsFor(source,id,tour);if(!qs.length)return'empty';if(isValid(source,id,tour))return'done';if(st.wasValidated[`${tour}:${source}:${id}`])return'update';return answeredCount(qs)>0?'ongoing':'todo'}

function transversePage(){return pageHead('Questionnaires transversaux','Des échantillons de propositions sélectionnées dans plusieurs thèmes généraux.')+overall('transversaux')+`<div class="section-title"><h2>Les questionnaires</h2><span class="pill">10 échantillons identiques pour tous les profils</span></div><div class="transverse">${transverse.map(([name,desc],i)=>{let qs=qsFor('transversaux',i),s=stat('transversaux',i),n=answeredCount(qs);return`<div class="card"><div class="actions" style="justify-content:space-between"><span class="eyebrow">Questionnaire ${String(i+1).padStart(2,'0')}</span>${statusBadge(s)}</div><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="small muted" style="margin-bottom:8px">${n} / ${qs.length} propositions évaluées</div>${miniProgress(n,qs.length)}<div class="actions">${s==='done'?btn('Résultats',`openResult('transversaux',${i})`,'primary sm')+btn('Comparer',`openCompare('transversaux',${i})`,'sm'):btn(s==='todo'?'Démarrer':s==='update'?'Compléter':'Continuer',`openQuestion('transversaux',${i})`,'primary sm')}</div></div>`}).join('')}</div>`}
function questionPage(){let qs=listQ();if(!qs.length)return pageHead('Questionnaire hors périmètre','Aucune proposition des finalistes dans ce questionnaire.')+btn('Retour à la liste',`go('${st.source}')`);st.idx=Math.min(st.idx,qs.length-1);let q=qs[st.idx],n=answeredCount(qs),p=n/qs.length*100,val=st.answers[q.id],locked=isLocked(q.id),label=st.source==='themes'?st.theme:transverse[st.trans][0];return`<div class="question-layout"><div class="question-main"><div class="backline"><button class="btn linklike" onclick="go('${st.source}')">← Retour à la liste des questionnaires</button><div class="actions"><span class="small muted" id="saveText">${st.saveState||'Sauvegarde locale de démonstration'}</span>${btn('▣ Sauvegarder',`saveAnswers()`,'primary sm')}</div></div><div class="card question-card"><div class="question-upper"><div><h2>${esc(label)}</h2><div class="small">Proposition ${st.idx+1} sur ${qs.length}</div></div><div class="actions">${btn('←',`moveQuestion(-1)`,'sm')}${btn('→',`moveQuestion(1)`,'sm')}</div></div><div class="progress"><span style="width:${p}%"></span></div><h3 class="question-statement">${esc(q.text)}</h3><div class="scale-legend"><span>Fort désaccord</span><span>Neutre / Indécis</span><span>Fort accord</span></div><div class="ratings">${Array.from({length:7},(_,i)=>i-3).map(i=>`<button class="rating ${i<0?'neg':i===0?'neutral':''} ${val===i?'selected':''} ${locked?'locked':''}" ${locked||!st.write?'disabled':''} onclick="rate('${esc(q.id)}',${i})">${i>0?'+'+i:i}</button>`).join('')}</div><div class="source-box"><b>Proposition anonymisée</b><p>L’identité du candidat reste masquée jusqu’à la validation du questionnaire. Le contenu et les sources ci-dessous sont des données fictives destinées au prototype.</p><a href="#" onclick="event.preventDefault();toast('Lien de source fictif dans ce prototype')">↗ Source de la proposition</a></div><div class="question-actions"><span class="badge ${locked?'done':val!==undefined?'ongoing':'todo'}">${locked?'Réponse verrouillée':val!==undefined?'Réponse enregistrée':'À évaluer'}</span><div class="actions">${btn('Proposition précédente',`moveQuestion(-1)`,'sm')}${btn(st.idx===qs.length-1?'Valider le questionnaire':'Proposition suivante',st.idx===qs.length-1?'validateCurrent()':'moveQuestion(1)','primary')}</div></div></div></div><div class="right-rail"><div class="card rail-card"><h3>Votre progression</h3><div class="ringrow"><div class="ring" style="--pct:${p}%"><div>${n} / ${qs.length}<small>${Math.round(p)} %</small></div></div><div class="small"><b style="color:var(--blue)">${esc(label)}</b><div style="margin-top:10px;color:var(--green)">● ${n} réponses</div><div style="margin-top:6px;color:#7487a5">○ ${qs.length-n} à compléter</div><div style="margin-top:6px;color:#7487a5">▤ ${qs.length} au total</div></div></div></div><div class="card rail-card"><h3>Liste des propositions</h3><div class="rail-items">${qs.map((v,i)=>`<button class="rail-item ${i===st.idx?'active':''}" onclick="jump(${i})"><span class="qnum">${i+1}</span><span class="qtext">${esc(v.text)}</span><span class="${st.answers[v.id]!==undefined?'ok':'todo'}">${st.answers[v.id]!==undefined?'●':'○'}</span></button>`).join('')}</div></div><div class="inline-notice">Les réponses déjà verrouillées par un autre questionnaire ne peuvent plus être modifiées.</div></div></div>`}
function candidateSubset(){return st.tour===2?people.slice(0,2):people}
function viewQs(){if(st.scope==='questionnaire')return qsFor(st.source,qid());if(st.scope==='general')return groups.find(x=>x[0]===st.group)[1].flatMap(t=>qsFor('themes',t));return st.source==='transversaux'?transverse.flatMap((_,i)=>qsFor('transversaux',i)):groups.flatMap(g=>g[1]).flatMap(t=>qsFor('themes',t))}
function uniqueQs(){return Array.from(new Map(viewQs().map(q=>[q.id,q])).values())}
function scoreFor(c,side=0){let q=uniqueQs().filter(x=>x.candidate===c);if(!q.length)return null;let a=q.map((x,i)=>side?syntheticValue(x.id):st.answers[x.id]??demoValue(x.id));return{value:a.reduce((s,n)=>s+n,0)/a.length,n:a.length,pos:a.filter(x=>x>0).length,zero:a.filter(x=>x===0).length,neg:a.filter(x=>x<0).length}}
function demoValue(id){return(idHash(id)*3+id.length)%7-3}function syntheticValue(id){return(idHash(id)*5+id.length*2)%7-3}
function chartDivergent(compare=false){return`<div class="card pad"><div class="chart-head"><h3>Affinité avec les candidats</h3><span>Diagramme divergent · −3 à +3</span></div>${candidateSubset().map((name,i)=>{let s=scoreFor(i),alt=scoreFor(i,1);if(!s)return'';let bar=(sc,other)=>{let v=sc.value,w=Math.abs(v)/6*100;return`<span class="bar ${v<0?'neg':''} ${other?'alt':''}" style="left:${v<0?50-w:50}%;width:${w}%;${other?'opacity:.83;':''}"></span>`};return`<div class="chart-row"><div class="chart-name">${esc(name)}</div><div class="axis">${bar(s,false)}${compare?bar(alt,true):''}</div><div class="chart-value">${s.value>0?'+':''}${s.value.toFixed(2)}<div class="tiny muted">${s.n} prop.</div></div></div>`}).join('')}<div class="axislabels"><span>−3</span><span>0</span><span>+3</span></div>${compare?`<div class="legend"><span><i class="dot" style="background:var(--blue)"></i>${esc(st.login)}</span><span><i class="dot" style="background:var(--purple)"></i>${esc(st.secondLogin)}</span></div>`:''}</div>`}
function chartStack(compare=false){function line(name,s,purple){let tot=s.n||1;return`<div class="chart-row"><div class="chart-name">${esc(name)}${compare?`<div class="tiny muted">${purple?'Profil B':'Profil A'}</div>`:''}</div><div class="stack-track ${purple?'purple':''}"><span class="neg" style="width:${s.neg/tot*100}%"></span><span class="zero" style="width:${s.zero/tot*100}%"></span><span class="pos" style="width:${s.pos/tot*100}%"></span></div><div class="chart-value">${s.n}<div class="tiny muted">prop.</div></div></div>`}return`<div class="card pad"><div class="chart-head"><h3>Répartition des réponses</h3><span>Barres empilées normalisées</span></div>${candidateSubset().map((name,i)=>{let s=scoreFor(i);if(!s)return'';return line(name,s,false)+(compare?line(name,scoreFor(i,1),true):'')}).join('')}<div class="legend"><span><i class="dot" style="background:#db7280"></i>Désaccord</span><span><i class="dot" style="background:#b5bfd1"></i>Neutre</span><span><i class="dot" style="background:#2d81dc"></i>Accord</span></div><p class="tiny muted" style="margin:15px 0 0">Les nombres de propositions sont indiqués à côté des barres. La répartition est calculée pour chaque candidat.</p></div>`}
function ranked(side=0){return candidateSubset().map((name,i)=>({name,data:scoreFor(i,side)})).filter(x=>x.data).sort((a,b)=>b.data.value-a.data.value||b.data.pos-a.data.pos||b.data.n-a.data.n).slice(0,2)}
function podiumCard(label,side=0){let rr=ranked(side);return`<div class="podium"><div class="podium-title">${esc(label)}</div>${rr.map((r,i)=>`<div class="podium-line"><span class="medal ${i?'silver':''}">${i+1}</span>${esc(r.name)}<b>${r.data.value.toFixed(2)}</b></div>`).join('')}</div>`}

function details(compare=false){let qq=uniqueQs().slice(0,30);return`<div class="card pad"><div class="chart-head"><h3>Détail des réponses${compare?' comparées':''}</h3><span>${qq.length} propositions</span></div>${qq.map((p,i)=>{let a=st.answers[p.id]??demoValue(p.id),b=syntheticValue(p.id);return`<div class="detail"><div class="tiny muted">${esc(people[p.candidate])} · Proposition ${i+1}</div><p>${esc(p.text)}</p><div class="markrow"><span>−3</span><div class="marks"><span class="pin" style="left:${(a+3)/6*100}%" title="Profil A : ${a}"></span>${compare?`<span class="pin alt" style="left:${(b+3)/6*100}%" title="Profil B : ${b}"></span>`:''}</div><span>+3</span><b>${compare?`Distance ${Math.abs(a-b)}/6`:a>0?'+'+a:a}</b></div></div>`}).join('')}</div>`}

function scopeName(){if(st.scope==='global')return st.source==='themes'?'Résultats globaux par thème':'Résultats globaux transversaux';if(st.scope==='general')return st.group;return st.source==='themes'?st.theme:transverse[st.trans][0]}
function resultPage(){return pageHead('Mes résultats',`Périmètre : ${esc(scopeName())}. Les résultats sont calculés à partir des propositions évaluées.`,'Résultats',btn('Comparer avec un profil',`go('comparer')`,'primary'))+scopeFilters()+`<div class="inline-notice" style="margin-bottom:17px">Démonstration visuelle : scores et propositions fictifs. Dans le site final, cette page est réservée aux questionnaires validés.</div><div class="chart-layout">${chartDivergent()}${chartStack()}${podiumBlock()}${st.scope==='questionnaire'?details():''}</div>`}
function compMetrics(){let qq=uniqueQs(),vals=qq.map(x=>[st.answers[x.id]??demoValue(x.id),syntheticValue(x.id)]),n=vals.length||1,dist=vals.reduce((a,[x,y])=>a+Math.abs(x-y),0),same=vals.filter(([x,y])=>Math.sign(x)===Math.sign(y)).length,opp=vals.filter(([x,y])=>x*y<0).length,neutral=vals.filter(([x,y])=>(x===0)!==(y===0)).length;return{aff:Math.round(100*(1-dist/(6*n))),same:Math.round(same/n*100),opp:Math.round(opp/n*100),neutral:Math.round(neutral/n*100),vals}}
function metricCards(){let m=compMetrics();return`<div class="metric-grid">${[['Score d’affinité',m.aff+' %','Distance moyenne des notes'],['Concordance',m.same+' %','Réponses de même sens'],['Opposition',m.opp+' %','Réponses de sens opposé'],['Neutralité divergente',m.neutral+' %','Une réponse neutre']].map(a=>`<div class="card metric"><div class="title">${a[0]}</div><div class="big">${a[1]}</div><div class="desc">${a[2]}</div></div>`).join('')}</div>`}
function agreeBlocks(){let ar=uniqueQs().map(q=>({q,dist:Math.abs((st.answers[q.id]??demoValue(q.id))-syntheticValue(q.id))}));let sorted=[...ar].sort((a,b)=>a.dist-b.dist),reverse=[...ar].sort((a,b)=>b.dist-a.dist);return`<div class="twocol"><div class="card pad"><h3 class="card-title">Plus forts accords</h3><div class="card-sub">Les distances les plus faibles</div>${sorted.slice(0,3).map(x=>`<div class="profile-row"><div><strong>${esc(x.q.text)}</strong><p>Distance : ${x.dist} / 6</p></div><span class="badge done">Accord</span></div>`).join('')}</div><div class="card pad"><h3 class="card-title">Plus forts désaccords</h3><div class="card-sub">Les distances les plus élevées</div>${reverse.slice(0,3).map(x=>`<div class="profile-row"><div><strong>${esc(x.q.text)}</strong><p>Distance : ${x.dist} / 6</p></div><span class="badge update">Désaccord</span></div>`).join('')}</div></div>`}
function comparePage(){return pageHead('Comparer deux profils',`Périmètre : ${esc(scopeName())}. Convergences et divergences politiques.`,'Comparateur')+scopeFilters()+`<div class="card pad" style="margin-bottom:18px"><div class="compare-chips"><div class="field" style="margin:0"><label>Profil A</label><input value="${esc(st.login)}" disabled></div><div class="field" style="margin:0"><label>Profil B · login</label><input id="compareLogin" value="${esc(st.secondLogin)}"></div>${btn('Comparer',`submitCompare()`,'primary')}</div><p class="form-note" style="margin:10px 0 0">Dans la version finale, les deux profils doivent avoir validé tous les questionnaires du périmètre.</p></div>${metricCards()}<div class="chart-layout">${chartDivergent(true)}${chartStack(true)}${st.scope==='questionnaire'?details(true):podiumBlock(true)}${agreeBlocks()}</div>`}
function profilePage(){return pageHead('Gestion du profil','Accès en lecture seule par login, accès en écriture avec mot de passe.','Profil')+`<div class="card pad" style="margin-bottom:18px"><div class="profile-head"><div class="avatar">${esc(st.login[0].toUpperCase())}</div><div><h2 style="margin:0;font-size:23px">${esc(st.login)}</h2><span class="badge ${st.write?'done':'ongoing'}">${st.write?'Lecture et écriture':'Lecture seule'}</span></div></div></div><div class="profile-layout"><div class="card pad"><h3 class="card-title">Charger un profil</h3><p class="card-sub">Le login suffit pour consulter un profil en lecture seule.</p><div style="height:18px"></div><div class="field"><label>Login</label><input id="loadLogin" value="${esc(st.login)}" placeholder="Login du profil"></div><div class="field"><label>Mot de passe (facultatif)</label><input id="loadPassword" type="password" placeholder="Pour accéder en écriture"></div>${btn('Charger',`loadProfile()`,'primary')}</div><div class="card pad"><h3 class="card-title">Créer un profil</h3><p class="card-sub">Aucune adresse e-mail nécessaire. Aucun système de récupération.</p><div style="height:18px"></div><div class="field"><label>Login unique</label><input id="createLogin" placeholder="Choisissez un login"></div><div class="field"><label>Mot de passe</label><input type="password" id="createPassword" placeholder="Choisissez un mot de passe"></div><label class="small"><input type="checkbox" id="captchaCheck"> Je ne suis pas un robot (CAPTCHA simulé)</label><div style="margin-top:16px">${btn('Créer le profil',`createProfile()`,'primary')}</div></div></div><div class="section-title"><h2>Paramètres du profil</h2></div><div class="card pad"><div class="profile-row"><div><strong>Modifier mon login</strong><p>Le nouveau login sera public et unique.</p></div>${btn('Modifier',`changeLogin()`,'sm')}</div><div class="profile-row"><div><strong>Modifier mon mot de passe</strong><p>L’accès en écriture nécessite votre mot de passe.</p></div>${btn('Modifier',`changePassword()`,'sm')}</div><div class="profile-row"><div><strong>Supprimer définitivement mon profil</strong><p>Action irréversible. Aucune récupération de profil.</p></div>${btn('Supprimer',`deleteProfile()`,'danger sm')}</div></div>`}
function homePage(){return`<div class="card hero"><div class="eyebrow">Élection présidentielle française · 2027</div><h1>Évaluez les propositions sans connaître les candidats.</h1><p>Découvrez vos affinités politiques et comparez vos réponses avec celles de vos proches grâce à notre comparateur.</p><div class="actions">${btn('Commencer les questionnaires',`go('themes')`,'primary')}${btn('Découvrir les questionnaires transversaux',`go('transversaux')`)}</div><div class="art">▦</div></div>${stats()}<div class="twocol" style="margin-top:18px"><div class="card pad"><h3 class="card-title">Questionnaires par thème</h3><p class="muted small">33 questionnaires regroupés en 10 thèmes généraux. Évaluez l’ensemble des propositions d’un thème.</p>${btn('Explorer les thèmes',`go('themes')`,'primary')}</div><div class="card pad"><h3 class="card-title">Questionnaires transversaux</h3><p class="muted small">Des sélections de propositions pour une première lecture de vos affinités.</p>${btn('Explorer les questionnaires',`go('transversaux')`,'primary')}</div></div><div class="section-title"><h2>Comparer vos réponses</h2></div><div class="card pad"><p>Le moteur de comparaison permet de confronter deux profils à l’échelle d’un questionnaire, d’un thème général ou de l’ensemble des questionnaires.</p>${btn('Ouvrir le comparateur',`go('comparer')`,'primary')}</div>`}
function faqPage(){let q=[['Pourquoi les propositions sont-elles anonymisées ?','L’identité du candidat reste masquée pendant l’évaluation, puis est révélée après validation du questionnaire.'],['Comment fonctionne la notation ?','Chaque proposition est évaluée avec une note entière de −3 à +3.'],['Puis-je modifier mes notes ?','Les notes restent modifiables tant qu’elles ne sont pas verrouillées par une validation.'],['Pourquoi un questionnaire est-il « À compléter » ?','Une proposition a été ajoutée ou substantiellement modifiée depuis une précédente validation.'],['Comment comparer mon profil ?','Les deux profils doivent avoir validé les mêmes questionnaires pour le périmètre sélectionné.'],['Puis-je récupérer mon profil sans mot de passe ?','Aucune récupération de compte n’est prévue.']];return pageHead('FAQ','Questions fréquentes sur le fonctionnement du projet.','Informations')+`<div class="card">${q.map(([a,b])=>`<details class="faqitem"><summary>${a}</summary><p>${b}</p></details>`).join('')}</div>`}
function aboutPage(){return pageHead('À propos','Les objectifs et les principes du projet Jeu-vote.fr.','Informations')+`<div class="card pad"><h2>Le projet</h2><p>Jeu-vote.fr est une application de civic tech pour évaluer des propositions issues des programmes des candidats à l’élection présidentielle française de 2027.</p><h3>La méthodologie</h3><p>Les propositions sont classées par thèmes et présentées sans révéler l’identité de leur auteur avant validation. Les résultats reposent sur les notes attribuées par l’utilisateur.</p><h3>Les limites de lecture</h3><p>Les graphiques sont des indicateurs construits à partir des propositions recensées. Les différents candidats peuvent disposer de nombres de propositions différents.</p><div class="inline-notice">Texte de présentation fictif pour visualiser la page statique : le contenu définitif sera rédigé séparément.</div></div>`}
function candidatesPage(){return pageHead('Candidats','Informations sur les candidats et propositions recensées.','Informations')+`<div class="card pad"><p class="muted small">Données fictives de démonstration. Seuls les candidats actifs sont affichés.</p><table class="data-table"><thead><tr><th>Candidat</th><th>Date de naissance</th><th>Parti</th><th>Propositions recensées</th></tr></thead><tbody>${candidateSubset().map((c,i)=>`<tr><td><strong>${esc(c)}</strong></td><td>—</td><td>Parti fictif ${i+1}</td><td>${36-i*3}</td></tr>`).join('')}</tbody></table></div>`}
function contactPage(){return pageHead('Contact','Signalez une erreur ou adressez une remarque à l’équipe.','Informations')+`<div class="card pad" style="max-width:720px"><div class="field"><label>Nom ou login (facultatif)</label><input placeholder="Votre nom"></div><div class="field"><label>Adresse e-mail (facultative)</label><input placeholder="votre@email.fr"></div><div class="field"><label>Objet</label><select><option>Signaler une erreur</option><option>Poser une question</option><option>Faire une remarque</option></select></div><div class="field"><label>Message</label><textarea placeholder="Votre message..."></textarea></div>${btn('Envoyer le message',`toast('Formulaire fictif : aucun message envoyé')`,'primary')}</div>`}
function render(){document.getElementById('sitebar').style.borderTop=st.tour===2?'3px solid var(--purple)':'3px solid var(--blue)';document.getElementById('tour1').classList.toggle('active',st.tour===1);document.getElementById('tour2').classList.toggle('active',st.tour===2);let chip=document.getElementById('activeProfile');chip.textContent=(st.write?'● ':'◉ ')+st.login;chip.classList.toggle('write',st.write);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===st.page||(st.page==='questionnaire'&&b.dataset.page===st.source)));let maps={accueil:homePage,themes:themesPage,transversaux:transversePage,questionnaire:questionPage,resultats:resultPage,comparer:comparePage,profil:profilePage,faq:faqPage,apropos:aboutPage,candidats:candidatesPage,contact:contactPage};document.getElementById('app').innerHTML=(maps[st.page]||themesPage)()}
function go(p){st.page=p;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}function expand(g){st.expanded=st.expanded===g?'':g;render()}function setTour(t){if(t===2&&!st.tourEnabled){toast('Second tour non activé');return}st.tour=t;st.page='accueil';render();window.scrollTo(0,0)}
function setScope(scope,source){st.scope=scope;if(source)st.source=source;if(scope==='general'&&st.source!=='themes')st.source='themes'}function setGeneral(g){st.group=g;st.scope='general';st.source='themes'}function openQuestion(source,id){st.source=source;if(source==='themes'){st.theme=id;st.group=groups.find(g=>g[1].includes(id))?.[0]||'Finances publiques'}else st.trans=id;st.idx=0;go('questionnaire')}function openResult(source,id){st.source=source;if(source==='themes'){st.theme=id;st.group=groups.find(g=>g[1].includes(id))?.[0]||st.group}else st.trans=id;st.scope='questionnaire';go('resultats')}function openCompare(source,id){st.source=source;if(source==='themes'){st.theme=id;st.group=groups.find(g=>g[1].includes(id))?.[0]||st.group}else st.trans=id;st.scope='questionnaire';go('comparer')}
function jump(i){st.idx=i;render()}function moveQuestion(d){let n=listQ().length;st.idx=Math.min(n-1,Math.max(0,st.idx+d));render()}
function rate(id,value){if(!st.write)return toast('Ce profil est en lecture seule');if(isLocked(id))return toast('Réponse définitivement verrouillée');st.answers[id]=value;st.draft[id]=true;st.saveState='Modifications non enregistrées';render()}
function saveAnswers(){st.saveState='Sauvegardé · démonstration';render();toast('Réponses sauvegardées dans le prototype')}function validateCurrent(){let qq=listQ(),missing=qq.findIndex(p=>st.answers[p.id]===undefined);if(missing>=0){st.idx=missing;render();toast('Évaluez toutes les propositions avant validation');return}let k=currentKey();st.validated[k]=true;st.wasValidated[k]=true;qq.forEach(p=>{st.locks[p.id]=true;delete st.changed[p.id]});for(let [g,themes] of groups)for(let t of themes){for(let tour of [1,2]){let q=qsFor('themes',t,tour);if(q.length&&q.every(p=>isLocked(p.id))){st.validated[keyTour(tour,'themes',t)]=true;st.wasValidated[keyTour(tour,'themes',t)]=true}}}for(let i=0;i<transverse.length;i++)for(let tour of [1,2]){let q=qsFor('transversaux',i,tour);if(q.length&&q.every(p=>isLocked(p.id))){st.validated[keyTour(tour,'transversaux',i)]=true;st.wasValidated[keyTour(tour,'transversaux',i)]=true}}openResult(st.source,qid());toast('Questionnaire validé : réponses verrouillées')}
function keyTour(t,s,id){return`${t}:${s}:${id}`}
function submitCompare(){st.secondLogin=document.getElementById('compareLogin').value.trim()||'profil_alex';render();toast('Comparaison actualisée · données fictives')}
function loadProfile(){let login=document.getElementById('loadLogin').value.trim(),pass=document.getElementById('loadPassword').value;if(!login)return toast('Saisissez un login');st.login=login;st.write=!!pass;render();toast('Profil chargé · simulation')}
function createProfile(){let login=document.getElementById('createLogin').value.trim(),pass=document.getElementById('createPassword').value,check=document.getElementById('captchaCheck').checked;if(!login||!pass||!check)return toast('Complétez le login, le mot de passe et le CAPTCHA');st.login=login;st.write=true;st.answers={};st.locks={};st.validated={};st.wasValidated={};render();toast('Profil fictif créé')}
function changeLogin(){if(!st.write)return toast('Authentification requise');let l=prompt('Nouveau login :',st.login);if(l?.trim()){st.login=l.trim();render();toast('Login modifié dans la démonstration')}}function changePassword(){if(!st.write)return toast('Authentification requise');modal('Modifier le mot de passe',`<div class="field"><label>Mot de passe actuel</label><input type="password" placeholder="Mot de passe actuel"></div><div class="field"><label>Nouveau mot de passe</label><input type="password" placeholder="Nouveau mot de passe"></div>`,()=>{closeModal();toast('Mot de passe modifié · simulation')})}function deleteProfile(){if(!st.write)return toast('Authentification requise');modal('Supprimer définitivement ce profil ?',`<p>Cette action est irréversible. Dans ce prototype, elle réinitialise seulement les données fictives.</p>`,()=>{st.login='mon_profil';st.write=false;st.answers={};st.locks={};st.validated={};st.wasValidated={};closeModal();go('profil');toast('Profil de démonstration réinitialisé')})}
function modal(title,inner,onOk){document.getElementById('modal').innerHTML=`<div class="modal-overlay"><div class="modal card"><h2>${title}</h2>${inner}<div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="modalOk">Confirmer</button></div></div></div>`;document.getElementById('modalOk').onclick=onOk}function closeModal(){document.getElementById('modal').innerHTML=''}let toastTimer;function toast(s){let n=document.getElementById('toastarea');n.innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.innerHTML='',3000)}
// Amorçage de quelques réponses et de statuts pour rendre tous les écrans visibles.
for(let i=0;i<4;i++){let p=qsFor('themes','Fiscalité')[i];st.answers[p.id]=[2,-1,0,3][i]}
for(let i=0;i<2;i++){let p=qsFor('themes','Santé')[i];st.answers[p.id]=[1,-2][i]}
render();
</script></body></html>
