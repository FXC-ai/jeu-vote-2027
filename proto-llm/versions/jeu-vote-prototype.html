const labels={todo:'À faire',progress:'En cours',complete:'Terminé',update:'À compléter'};
let state={page:'themes',tour:1,login:'mon_profil',mode:'write',expand:0,theme:'Fiscalité',scope:'questionnaire',scopeGroup:'Finances publiques',from:'themes',answers:{1:2,2:-1,3:0},validated:false,showAll:true,showModal:false};
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function toast(t){let x=el('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function navigate(page,props={}){Object.assign(state,props,{page});document.querySelector('header nav').classList.remove('open');window.scrollTo(0,0);render()}
function changeTour(){state.tour=state.tour===1?2:1;state.page='themes';state.expand=0;render();window.scrollTo(0,0);toast('Mode '+(state.tour===1?'premier':'second')+' tour activé · aperçu')}
function header(title,subtitle,crumb='',actions=''){return `<div class="crumbs">Jeu-vote.fr ${crumb?' / <b>'+crumb+'</b>':''} / ${state.tour===1?'Premier tour':'Second tour'}</div><div class="pagehead"><div><h1>${title}</h1><p>${subtitle}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`}
function button(t,fn,cl=''){return `<button class="btn ${cl}" onclick="${fn}">${t}</button>`}
function bar(a,b,cl=''){return `<div class="progress ${cl}"><span style="width:${Math.round(a/Math.max(b,1)*100)}%"></span></div>`}
function totals(kind){let n=kind==='transverse'?transverse.length:33;let done=kind==='transverse'?2:14;return {n,done}}
function overall(kind){let {n,done}=totals(kind);return `<div class="card overview"><div class="overview-top"><div><div class="eyebrow">Progression globale · ${kind==='themes'?'questionnaires par thème':'questionnaires transversaux'}</div><div class="overview-total">${done}<small> / ${n}</small></div><div class="muted tiny">questionnaires validés</div></div><div class="overall-actions">${button('▤ Résultats globaux',`navigate('results',{scope:'global',from:'${kind}'})`)}${button('⇄ Comparer',`navigate('compare',{scope:'global',from:'${kind}'})`,'primary')}</div></div>${bar(done,n)}<div class="overview-bottom"><span>${Math.round(done/n*100)} % complétés</span><span>Les résultats s’ouvrent une fois tous les questionnaires validés</span></div></div>`}
function getThemeStatus(i,j){if(state.tour===2&&['Outre-mer','Secteur bancaire & finance'].includes(categories[i][1][j]))return 'empty';let r=(i*4+j)%9;return r<3?'complete':r<6?'progress':r===6?'update':'todo'}
function topicCard(cat,i){let st=cat[1].map((n,j)=>getThemeStatus(i,j));let done=st.filter(s=>s==='complete').length;return `<div class="card topic-card"><button class="topic-top" onclick="state.expand=state.expand===${i}?-1:${i};render()"><div><div class="topic-name">${esc(cat[0])}</div><div class="topic-meta">${cat[1].length} questionnaires · ${done} validé${done>1?'s':''}</div></div><div class="topic-side"><div class="mini-ring" style="background:conic-gradient(var(--blue) 0 ${done/cat[1].length*100}%,#e9eff8 ${done/cat[1].length*100}%)"><span>${done}/${cat[1].length}</span></div><span style="color:#9eabbc">${state.expand===i?'⌃':'⌄'}</span></div></button>${state.expand===i?`<div class="topic-content"><div style="display:flex;gap:8px;justify-content:flex-end;padding:10px 0"><button class="quietlink" onclick="navigate('results',{scope:'general',scopeGroup:${JSON.stringify(cat[0]).replace(/"/g,"&quot;")}})">Résultats du thème général ↗</button><button class="quietlink" onclick="navigate('compare',{scope:'general',scopeGroup:${JSON.stringify(cat[0]).replace(/"/g,"&quot;")}})">Comparer ↗</button></div>${cat[1].map((n,j)=>themeRow(n,i,j,st[j])).join('')}</div>`:''}</div>`}
function themeRow(name,i,j,status){if(status==='empty')return `<div class="theme-row"><div class="theme-main"><div class="theme-name">${esc(name)}</div><div class="theme-sub">Aucune proposition des finalistes · hors périmètre</div></div><span class="tag">Désactivé</span></div>`;let count=12+((i*13+j*7)%39),done=status==='complete'?count:status==='todo'?0:status==='update'?count-2:Math.round(count*.48);return `<div class="theme-row"><div class="theme-main"><div class="theme-name">${esc(name)}</div><div class="theme-sub">${done}/${count} propositions notées</div></div><div class="theme-bar">${bar(done,count)}</div><span class="status ${status}">${labels[status]}</span><div class="theme-actions">${status==='complete'?`<button class="quietlink" onclick="navigate('results',{scope:'questionnaire',theme:${JSON.stringify(name).replace(/"/g,"&quot;")}})">Résultats</button><button class="quietlink" onclick="navigate('compare',{scope:'questionnaire',theme:${JSON.stringify(name).replace(/"/g,"&quot;")}})">Comparer</button>`:`<button class="quietlink" onclick="navigate('questionnaire',{theme:${JSON.stringify(name).replace(/"/g,"&quot;")},validated:false})">${{todo:'Démarrer',progress:'Continuer',update:'Compléter'}[status]} →</button>`}</div></div>`}
function themesPage(){return header('Questionnaires par thème','Évaluez les propositions des candidats, sans connaître leur identité.','Questionnaires')+overall('themes')+`<div class="sectionrow"><h2>Les 10 thèmes généraux</h2><span class="pill">33 questionnaires</span></div><div class="gridtwo">${categories.map(topicCard).join('')}</div>`}
function transversePage(){return header('Questionnaires transversaux','Des échantillons variés pour explorer rapidement vos affinités politiques.','Questionnaires')+overall('transverse')+`<div class="sectionrow"><h2>Questionnaires disponibles</h2><span class="pill">Aperçu : 6 questionnaires fictifs</span></div><div class="gridtwo">${transverse.map((v,i)=>`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px"><div class="eyebrow">Questionnaire ${String(i+1).padStart(2,'0')}</div><span class="status ${v.status}">${labels[v.status]}</span></div><h3 class="sectiontitle">${v.name}</h3><p class="muted tiny" style="margin:5px 0 19px">${v.desc}</p><div style="display:flex;justify-content:space-between" class="tiny muted"><span>${v.done} / ${v.count} propositions</span><b>${Math.round(v.done/v.count*100)} %</b></div><div style="margin:9px 0 22px">${bar(v.done,v.count)}</div>${v.status==='complete'?`${button('Voir les résultats',`navigate('results',{scope:'questionnaire',from:'transverse',theme:${JSON.stringify(v.name).replace(/"/g,"&quot;")}})`,'sm')} ${button('Comparer',`navigate('compare',{scope:'questionnaire',from:'transverse',theme:${JSON.stringify(v.name).replace(/"/g,"&quot;")}})`,'sm')}`:button(v.status==='todo'?'Démarrer':v.status==='progress'?'Continuer':'Compléter',`navigate('questionnaire',{theme:${JSON.stringify(v.name).replace(/"/g,"&quot;")},from:'transverse',validated:false})`,'primary sm')}</div>`).join('')}</div>`}
function questionnairePage(){let done=Object.keys(state.answers).length,n=proposals.length;return `<div class="question-shell">${header(esc(state.theme),'Évaluez chaque proposition sur une échelle de −3 à +3. Les candidats restent anonymes jusqu’à validation.','Questionnaire',button('← Retour à la liste',`navigate('${state.from==='transverse'?'transverse':'themes'}')`))}<div class="card overview"><div class="qtop"><div class="eyebrow">Votre progression</div><div class="qprogress">${done}/${n} propositions notées · ${Math.round(done/n*100)} %</div></div>${bar(done,n)}</div><div class="notice">Les notes déjà verrouillées dans d’autres questionnaires sont reprises automatiquement et ne peuvent pas être modifiées. Les propositions présentées ici sont fictives.</div>${proposals.map((p,i)=>questionCard(p,i)).join('')}<div class="qfooter"><span class="muted tiny">Les réponses sont conservées dans cet aperçu tant que cette page reste ouverte.</span><div class="qfooter-right">${button('Sauvegarder',"toast('Réponses sauvegardées dans le prototype')")}${button('Valider le questionnaire',"validateQuestionnaire()",'primary')}</div></div></div>`}
function questionCard(p,i){const val=state.answers[p.id],lock=state.validated;return `<article class="card qpanel"><div class="qnumber"><span>PROPOSITION ${String(i+1).padStart(2,'0')} / ${String(proposals.length).padStart(2,'0')}</span><span>${lock?'✓ VERROUILLÉE':val===undefined?'○ À ÉVALUER':'✓ NOTÉE'}</span></div><h3>${esc(p.text)}</h3>${lock?`<div class="locked">✓ Réponse validée et verrouillée · Votre note : ${val>0?'+':''}${val} · ${candidates[p.candidate]} (fictif)</div>`:`<div class="rating">${[-3,-2,-1,0,1,2,3].map(n=>`<button data-val="${n}" class="${val===n?'selected':''}" aria-label="Noter ${n}" onclick="setAnswer(${p.id},${n})">${n>0?'+':''}${n}</button>`).join('')}</div><div class="rate-label"><span>Pas du tout d’accord</span><span>Neutre / indécis</span><span>Tout à fait d’accord</span></div>`}</article>`}
function setAnswer(id,n){if(state.validated)return;state.answers[id]=n;render()}
function validateQuestionnaire(){let miss=proposals.filter(p=>state.answers[p.id]===undefined);if(miss.length){toast(`Il reste ${miss.length} proposition(s) à évaluer avant validation`);return;}state.validated=true;render();el('modal').innerHTML=`<div class="modal-wrap"><div class="card modal"><div style="font-size:38px;color:var(--green)">✓</div><h2>Questionnaire validé</h2><p>Toutes les propositions ont été évaluées. Vos réponses sont désormais verrouillées et l’identité des candidats peut être révélée.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Rester ici</button><button class="btn primary" onclick="closeModal();navigate('results',{scope:'questionnaire'})">Voir mes résultats →</button></div></div></div>`}
function closeModal(){el('modal').innerHTML=''}
function currentScope(){return state.scope==='questionnaire'?state.theme:state.scope==='general'?state.scopeGroup:(state.from==='transverse'?'Tous les questionnaires transversaux':'Tous les questionnaires par thème')}
function scopeSelector(dest){return `<div class="toggle"><button class="${state.scope==='questionnaire'?'on':''}" onclick="navigate('${dest}',{scope:'questionnaire'})">Questionnaire</button><button class="${state.scope==='general'?'on':''}" onclick="navigate('${dest}',{scope:'general'})">Thème général</button><button class="${state.scope==='global'?'on':''}" onclick="navigate('${dest}',{scope:'global'})">Global</button></div>`}
function chartTop(title,descr){return `<div class="chart-head"><div><h3 class="sectiontitle">${title}</h3><p>${descr}</p></div><span class="tag">Données de démonstration</span></div>`}
function divergent(compare=false){return `<div class="card chart-card">${chartTop('Affinité avec les candidats','Score moyen sur une échelle de −3 à +3 · nombre de propositions évaluées')}${compare?`<div class="chart-legend"><span><i class="dot" style="background:#5380e0"></i>${esc(state.login)}</span><span><i class="dot" style="background:#9376d1"></i>profil_alex</span></div>`:''}<div class="div-bars ${compare?'compare-scores':''}" style="margin-top:20px">${candidates.slice(0,state.tour===2?2:5).map((n,i)=>{let a=cScores[i],b=[1.1,-.4,.8,.3,-.2][i];return `<div class="divrow"><div class="name">${n}</div>${compare?`<div class="pair">${[a,b].map((v,j)=>`<div class="axis ${j===0?'blue':'purple'}">${barSegment(v)}</div>`).join('')}</div><div class="score">${(a>=0?'+':'')+a.toFixed(1)}<small>${(b>=0?'+':'')+b.toFixed(1)}</small></div>`:`<div class="axis">${barSegment(a)}</div><div class="score">${a>0?'+':''}${a.toFixed(1)}<small>${cCounts[i]} prop.</small></div>`}</div>`}).join('')}</div><div class="axis-foot"><span>−3</span><span>0</span><span>+3</span></div></div>`}
function barSegment(v){return `<span class="${v<0?'neg':'pos'}" style="width:${Math.abs(v)/3*50}%"></span>`}
function stacked(compare=false){let vals=[[63,17,20],[49,19,32],[26,30,44],[52,25,23],[18,16,66]], vals2=[[45,20,35],[31,26,43],[48,22,30],[40,33,27],[31,28,41]];return `<div class="card chart-card">${chartTop('Répartition des réponses','Part des propositions en accord, neutres ou en désaccord') }<div class="chart-legend"><span><i class="dot" style="background:#65ad9a"></i>Accord</span><span><i class="dot" style="background:#c2cbd7"></i>Neutre / Indécis</span><span><i class="dot" style="background:#df94a2"></i>Désaccord</span></div><div class="stack-rows" style="margin-top:20px">${candidates.slice(0,state.tour===2?2:5).map((n,i)=>`<div class="stack-row"><div class="name">${n}</div><div>${[vals[i],...(compare?[vals2[i]]:[])].map(v=>`<div class="stack" style="margin:3px 0"><span class="agree" style="width:${v[0]}%"></span><span class="neutral" style="width:${v[1]}%"></span><span class="disagree" style="width:${v[2]}%"></span></div>`).join('')}</div><div class="stackval">${compare?'A / B':cCounts[i]+' prop.'}</div></div>`).join('')}</div><div class="muted tiny" style="margin-top:17px">Les effectifs et pourcentages affichés sont fictifs. Les taux sont normalisés à 100 % par candidat.</div></div>`}
function podiums(){let names=state.scope==='global'?(state.from==='transverse'?transverse.slice(0,4).map(x=>x.name):categories.slice(0,5).map(x=>x[0])):state.scope==='general'?(categories.find(x=>x[0]===state.scopeGroup)?.[1]||['Fiscalité','Dette & déficit']):[];return names.length?`<div class="card pad"><div class="sectionrow" style="margin:0 0 18px"><h3 class="sectiontitle">Podiums par ${state.from==='transverse'?'questionnaire transversal':state.scope==='general'?'questionnaire':'thème général'}</h3><span class="tag">2 candidats favoris</span></div><div class="podiums">${names.map((n,i)=>`<div class="podium"><div class="title">${esc(n)}</div><div class="line"><span class="medal">1</span>${candidates[i%2]}<span class="p-val">+${(1.8-i*.12).toFixed(1)}</span></div><div class="line"><span class="medal silver">2</span>${candidates[(i+1)%3]}<span class="p-val">+${(1.1-i*.09).toFixed(1)}</span></div></div>`).join('')}</div></div>`:''}
function detailResults(){return `<div class="card pad"><div class="sectionrow" style="margin:0 0 8px"><h3 class="sectiontitle">Détail de vos réponses</h3><span class="tag">5 propositions d’exemple</span></div>${proposals.map((p,i)=>`<div class="detailrow"><div class="tiny muted">${esc(candidates[p.candidate])} · Proposition ${i+1}</div><div class="proposal">${esc(p.text)}</div><div class="detailscale"><small class="muted">−3</small><div class="scale-bg"><span class="pin" style="left:${((state.answers[p.id]??[2,-1,0,1,-2][i])+3)/6*100}%"></span></div><small class="muted">+3</small><b style="width:24px;text-align:right;color:#3a597e">${state.answers[p.id]??[2,-1,0,1,-2][i]}</b></div></div>`).join('')}</div>`}
function resultsPage(){return header('Mes résultats',`Périmètre : ${esc(currentScope())}. Résultats recalculés à chaque consultation.`,'Résultats',button('⇄ Comparer avec un profil',"navigate('compare')",'primary'))+`<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:21px">${scopeSelector('results')}<span class="status complete">✓ Questionnaire validé · démonstration</span></div><div class="result-layout">${divergent()}${stacked()}${podiums()}${state.scope==='questionnaire'?detailResults():''}</div>`}
function metrics(){return `<div class="metricgrid">${[['73 %','Score d’affinité','Distance moyenne normalisée'],['58 %','Concordance','Même sens de réponse'],['27 %','Opposition','Opinions opposées'],['15 %','Neutralité divergente','Une réponse à zéro']].map(x=>`<div class="card metric"><div class="eyebrow" style="letter-spacing:.5px">${x[1]}</div><div class="value">${x[0]}</div><div class="micro">${x[2]}</div></div>`).join('')}</div>`}
function detailedCompare(){return `<div class="card pad"><h3 class="sectiontitle">Détail des réponses comparées</h3><div class="chart-legend" style="margin:10px 0 13px"><span><i class="dot" style="background:var(--blue)"></i>${esc(state.login)}</span><span><i class="dot" style="background:var(--purple)"></i>profil_alex</span></div>${proposals.map((p,i)=>{let a=state.answers[p.id]??[2,-1,0,1,-2][i],b=[1,-3,0,3,2][i];return `<div class="detailrow"><div class="tiny muted">Proposition ${i+1} · ${candidates[p.candidate]}</div><div class="proposal">${esc(p.text)}</div><div class="detailscale"><small class="muted">−3</small><div class="scale-bg"><span class="pin" style="left:${(a+3)/6*100}%"></span><span class="pin alt" style="left:${(b+3)/6*100}%"></span></div><small class="muted">+3</small><span class="diff" style="min-width:79px">Distance : ${Math.abs(a-b)}/6</span></div></div>`}).join('')}</div>`}
function agreements(){return `<div class="gridtwo"><div class="card pad"><h3 class="sectiontitle">Plus forts accords</h3><div class="muted tiny" style="margin:3px 0 17px">Les distances les plus faibles</div>${['Renforcer les moyens de lutte contre la fraude fiscale.','Moderniser les services administratifs locaux.','Améliorer l’accès aux soins de proximité.'].map((x,i)=>`<div class="profiletile"><div><b style="font-size:12px">${x}</b><p>Distance ${i===0?'0':'1'} / 6</p></div><span class="status complete">Accord</span></div>`).join('')}</div><div class="card pad"><h3 class="sectiontitle">Plus forts désaccords</h3><div class="muted tiny" style="margin:3px 0 17px">Les distances les plus élevées</div>${['Instaurer une contribution sur les hauts patrimoines.','Réduire certaines dépenses publiques.','Modifier les critères d’accès à certaines aides.'].map((x,i)=>`<div class="profiletile"><div><b style="font-size:12px">${x}</b><p>Distance ${6-i} / 6</p></div><span class="status update">Désaccord</span></div>`).join('')}</div></div>`}
function comparePage(){return header('Comparer deux profils',`Périmètre : ${esc(currentScope())}. Découvrez vos convergences et divergences politiques.`,'Comparateur',button('Voir mes résultats',"navigate('results')"))+`<div class="card pad" style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><div class="eyebrow">Périmètre de la comparaison</div><div style="margin-top:6px">${scopeSelector('compare')}</div></div><span class="status complete">✓ Les deux profils ont validé ce périmètre · aperçu</span></div><div class="formgrid" style="margin-top:22px"><div class="field" style="margin:0"><label>Profil A</label><input readonly value="${esc(state.login)}"></div><div class="field" style="margin:0"><label>Profil B · login</label><div style="display:flex;gap:8px"><input id="secondProfile" value="profil_alex"><button class="btn primary" onclick="toast('Comparaison actualisée · valeurs fictives')">Comparer</button></div></div></div></div>${metrics()}<div class="result-layout">${divergent(true)}${stacked(true)}${state.scope==='questionnaire'?detailedCompare():''}${agreements()}</div>`}
function profilePage(){return header('Mon profil','Consultez vos accès, vos questionnaires et les paramètres de votre profil.','Profil')+`<div class="card pad"><div class="profilehero"><div class="bigavatar">${esc(state.login[0]||'M').toUpperCase()}</div><div><h2>${esc(state.login)}</h2><span class="status ${state.mode==='write'?'complete':'progress'}">${state.mode==='write'?'✓ Lecture et écriture':'◉ Lecture seule'}</span></div></div><div class="gridtwo"><div><h3 class="sectiontitle">Charger un profil</h3><p class="muted tiny">Le login suffit pour ouvrir un profil en lecture seule.</p><div class="field"><label>Login du profil</label><input id="loginInput" placeholder="Ex. profil_alex" value="${esc(state.login)}"></div><div class="field"><label>Mot de passe (facultatif)</label><input id="passwordInput" type="password" placeholder="Pour obtenir l’accès en écriture"></div><button class="btn primary" onclick="loadProfile()">Charger le profil →</button></div><div><h3 class="sectiontitle">Créer un profil</h3><p class="muted tiny">Aucune adresse e-mail nécessaire. Aucun système de récupération de compte.</p><div class="field"><label>Choisir un login</label><input id="newLogin" placeholder="Votre login unique"></div><div class="field"><label>Choisir un mot de passe</label><input type="password" id="newPass" placeholder="Votre mot de passe"></div><label class="check tiny"><input type="checkbox" id="captcha"> Je confirme être une personne (simulation CAPTCHA)</label><div style="margin-top:16px"><button class="btn" onclick="createProfile()">Créer mon profil</button></div></div></div></div><div class="sectionrow"><h2>Gestion de mon profil</h2><span class="pill">${state.mode==='write'?'Modification autorisée':'Lecture seule'}</span></div><div class="card pad"><div class="profiletile"><div><b>Modifier mon login</b><p>Choisir un nouveau login public et unique</p></div><button class="btn sm" ${state.mode!=='write'?'disabled':''} onclick="editLogin()">Modifier</button></div><div class="profiletile"><div><b>Modifier mon mot de passe</b><p>L’accès en écriture reste privé</p></div><button class="btn sm" ${state.mode!=='write'?'disabled':''} onclick="toast('Aperçu : formulaire de modification du mot de passe')">Modifier</button></div><div class="profiletile"><div><b>Supprimer définitivement mon compte</b><p>Action irréversible · simulation uniquement</p></div><button class="btn sm" ${state.mode!=='write'?'disabled':''} onclick="deleteProfile()" style="color:#c65269">Supprimer</button></div></div>`}
function loadProfile(){let login=el('loginInput').value.trim(),pass=el('passwordInput').value;if(!login)return toast('Veuillez renseigner un login');state.login=login;state.mode=pass?'write':'read';render();toast('Profil chargé en '+(pass?'lecture et écriture':'lecture seule')+' · simulation')}
function createProfile(){let login=el('newLogin').value.trim(),pw=el('newPass').value;if(!login||!pw||!el('captcha').checked)return toast('Compléter le login, le mot de passe et le CAPTCHA');state.login=login;state.mode='write';render();toast('Profil fictif créé pour cet aperçu')}
function editLogin(){let n=prompt('Nouveau login :',state.login);if(n&&n.trim()){state.login=n.trim();render();toast('Login modifié dans le prototype')}}
function deleteProfile(){if(confirm('Supprimer définitivement ce profil fictif de la démonstration ?')){state.login='mon_profil';state.mode='read';state.answers={};state.validated=false;render();toast('Profil de démonstration réinitialisé')}}
function render(){el('siteHeader').classList.toggle('second',state.tour===2);el('tourSwitch').textContent=(state.tour===1?'◉ Premier tour':'◉ Second tour')+' ▾';el('topLogin').textContent=state.login;document.querySelectorAll('[data-target]').forEach(b=>b.classList.toggle('active',b.dataset.target===state.page));el('app').innerHTML=({themes:themesPage,transverse:transversePage,questionnaire:questionnairePage,results:resultsPage,compare:comparePage,profile:profilePage}[state.page]||themesPage)()}
render();
</script>
</body></html>
