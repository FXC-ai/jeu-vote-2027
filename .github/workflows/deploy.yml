name: Déploiement automatique VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.JEU_VOTE_DEPLOY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            cd /home/debian/jeu-vote-2027

            test -f .env
            test -f php-fpm/app/.env

            git pull --ff-only origin main

            sudo docker compose -f docker-compose.yml build

            sudo docker compose -f docker-compose.yml down

            if sudo docker volume inspect jeu-vote-2027_public-data >/dev/null 2>&1; then
                sudo docker volume rm jeu-vote-2027_public-data
            fi

            sudo docker compose -f docker-compose.yml up --no-build -d
